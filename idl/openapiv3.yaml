openapi: "3.0.0"
info:
  version: "1.0.0"
  title: "StarRoll API"

paths:
  # GUI
  /api/displayChatRoom:
    get:
      summary: Display chat room entry button in GUI
      description: Returns data to render chat room entry button in the graphical interface
      responses:
        '200':
          description: Button configuration retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomID:
                    type: string
                  roomName:
                    type: string
                  buttonText:
                    type: string
                  isVisible:
                    type: boolean
                  style:
                    type: object
                    description: GUI styling properties
                    properties:
                      color:
                        type: string
                      size:
                        type: string
  
  /api/exitChatRoom:
    post:
      summary: Exit chat room
      description: Updates user's participation status and triggers related notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - roomId  
                - userId  
              properties:
                roomId:
                  type: string
                  description: ID of the chat room to exit
                userId:
                  type: string
                  description: ID of the user exiting the chat room
                sendNotification:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Successfully exited chat room
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomId:
                    type: string
                  userId:
                    type: string
                  status:
                    type: string
                  notificationSent:
                    type: boolean
  # Data collection module
  /api/getLocation:
    post:
      summary: Get current location
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GPS"
  /api/getAttitude:
    post:
      summary: Get attitude of the mobile device
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/attitude"
  /api/getCameraData:
    post:
      summary: Get camera data
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  cameraMeta:
                    $ref: "#/components/schemas/cameraMeta"
                  image:
                    description: image read from camera
                    type: string
  # Astronomy Engine
  /api/getStarCatalog:
    post:
      summary: Get star catalog
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  starsNumber:
                    description: stars number
                    type: integer
                  starMetaList:
                    type: array
                    items:
                      $ref: "#/components/schemas/starMeta"
  /api/calculateStarCoordinates:
    post:
      summary: calculate star coordinates
      requestBody:
        content:
          application/json:
            schema:
              properties:
                timeStamp:
                  description: UTC time stamp
                  type: integer
                cameraMeta:
                  $ref: "#/components/schemas/cameraMeta"
                attitude:
                  $ref: "#/components/schemas/attitude"
                starMetaList:
                  type: array
                  items:
                    $ref: "#/components/schemas/starMeta"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  starCoordinates:
                    type: array
                    items:
                      properties:
                        HIP:
                          type: integer
                        viewCoordinate:
                          $ref: "#/components/schemas/viewCoordinate"
  # Error Elimination Module
  /api/elimilateErrors:
    post:
      summary: Eliminating the errors between the stars' positions that we calculated and the stars' positions captured by the camera. These errors are generally caused by the limited accuracy of the sensor.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                cameraMeta:
                  $ref: "#/components/schemas/cameraMeta"
                image:
                  description: image read from camera
                  type: string
                starCoordinates:
                  type: array
                  items:
                    properties:
                      HIP:
                        type: integer
                      viewCoordinate:
                        $ref: "#/components/schemas/viewCoordinate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  starCoordinates:
                    type: array
                    items:
                      properties:
                        HIP:
                          type: integer
                        correctedViewCoordinate:
                          $ref: "#/components/schemas/viewCoordinate"
  # Render Engine

  # User System

  # Social System
  /api/getChatRoom:
    post:
      summary: Join the chat room
      description: Join the chat room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - roomId
                - userStatus  
                - userId
                - roomStatus  
              properties:
                roomId:
                  type: string
                  description: Unique ID of the target chat room in the social system
                userId:
                  type: string
                  description: ID of the user attempting to access the chat room
                userStatus:
                  type: boolean
                  description: Check user status
                roomStatus:
                  type: boolean
                  description: Check room status
      responses:
        '200':
          description: Successfully entered the chat room
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  message:
                    type: string
  /api/getChatRoomInfo:
    post:
      summary: Retrieve chat room from social system
      description: Gets specified chat room information from the social system
      requestBody:
        content:
          application/json:  
            schema:
              type: object
              required:
                - roomId  
              properties:
                roomID:
                  type: string             
      responses:
        '200':
          description: Chat room information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomID:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  creationTime:
                    type: string
                  OnlineUsers:
                    type: integer
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        userID:
                          type: string
                        username:
                          type: string
                        isOnline:
                          type: boolean

  /api/getMessage:
    post:
      summary: Retrieve chat room messages
      description: Gets historical and real-time messages from the chat room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - roomID 
              properties:
                roomID:
                  type: string
                  description: ID of the chat room to retrieve messages from
                limit:
                  type: integer
                  description: Maximum number of messages to retrieve
                  default: 300
                timestamp:
                  type: string
                  description: Retrieve messages sent before this timestamp
      responses:
        '200':
          description: Messages retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomId:
                    type: string
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        messageId:
                          type: string
                        userId:
                          type: string
                        content:
                          type: string
                        timestamp:
                          type: string

  /api/sendMessage:
    post:
      summary: Send message to chat room
      description: Sends a message to the specified chat room for real-time communication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object  
              properties:
                roomId:
                  type: string
                  description: ID of the target chat room
                userId:
                  type: string
                  description: ID of the user sending the message
                content:
                  type: string
                  description: Content of the message to send
      responses:
        '200':
          description: Message sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  messageId:
                    type: string
                  timestamp:
                    type: string
                  status:
                    type: string
  /api/getStarDetails:
    post:
      summary: calculate star details
      requestBody:
        content:
          application/json:
            schema:
              properties:
                HIP:
                  type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/starDetails"
  /api/checkRoomStatus:
    post:
      summary: Check chat room status
      description: Determines if a user can join the specified chat room
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - roomID 
              properties:
                roomId:
                  type: string
                  description: ID of the chat room to check
      responses:
        '200':
          description: Room status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomID:
                    type: string
                  isJoinable:
                    type: boolean
                  status:
                    type: string
                  message:
                    type: string
  /api/setUser:
    post:
      summary: "Set/modify username and password"
      description: "Modify the username and password by the username, current password(password0)and new password(password1) user provided."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: "Modify password successful."
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                    example: "Password updated successfully"
        "400":
          description: "Invalid request: For example, the new password does not meet the security requirements, or the new and old passwords are the same."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized: Current password (password0) is incorrect"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found: The username does not exist."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/userLogin:
    post:
      summary: "User login"
      description: "Use username and password to authentication, return a token if success."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAuth"
      responses:
        "200":
          description: "Login successful."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: "Unauthorized: Incorrect username or password."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/userReg:
    post:
      summary: "User register"
      description: "Create an account with a new username and password."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAuth"
      responses:
        "201":
          description: "Create user successful."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Invalid request: For example, the password does not meet the requirements."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Conflict: The username is already in use."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/usernameVerify:
    post:
      summary: "Verify the username"
      description: "Check whether the username is available."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                username:
                  type: string
                  description: "The username to be checked"
                  example: "new_user_123"
      responses:
        "200":
          description: "Username available"
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                    example: "Username is available"
        "409":
          description: "The username is already in use."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/verifyUserToken:
    post:
      summary: "Verify the user's Token"
      description: "Check whether the provided Token is valid. If it is valid, return the corresponding user information."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                token:
                  type: string
                  description: "The verified access token."
      responses:
        "200":
          description: "Token is valid."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: "Invalid or expired Token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

# Reused schemas
components:
  schemas:
    userCredentials:
      type: object
      properties:
        userID:
          type: string
        token:
          type: string
    GPS:
      description: GPS location
      type: object
      properties:
        longitude:
          type: number
        latitude:
          type: number
    attitude:
      description: attitude of the mobile device
      type: object
      properties:
        roll:
          type: number
        pitch:
          type: number
        yaw:
          type: number
    cameraMeta:
      type: object
      properties:
        focalLength:
          description: 35mm equivalent focal length
          type: number
        length:
          description: image length, pixels
          type: integer
        hight:
          description: image hight, pixels
          type: integer
    starMeta:
      type: object
      properties:
        HIP:
          description: unique HIP index
          type: integer
        equatorialCoordinate:
          $ref: "#/components/schemas/equatorialCoordinate"
        magnitude:
          description: magnitude
          type: number
        pmRA:
          description: Proper motion mu_alpha.cos(delta), The proper motion of a star along its right ascension, radian per year
          type: number
        pmDE:
          description: Proper motion mu_delta, The proper motion of a star in the direction of declination, the radian per year
          type: number
        bvColor:
          description: A measure of its surface temperature, determined by the difference between its measured blue (B) magnitude and its visual (V) magnitude.
          type: number
    equatorialCoordinate:
      type: object
      properties:
        rightAscension:
          description: right ascension, degree
          type: number
        declination:
          description: Declination, degree
          type: number
    horizontalCoordinate:
      type: object
      properties:
        altitude:
          type: number
        azimuth:
          type: number
    viewCoordinate:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
    starDetails:
      type: object
      properties:
        HIP:
          type: integer
        alias:
          description: alternative names
          type: array
          items:
            type: string
        diatance:
          description: Distance, light-year
          type: number
        constellation:
          description: The constellation that the star belongs to.
          type: string
        details:
          description: Detailed introduction of stars
          type: string

    # input/output model
    UserAuth:
      description: "User credentials for login or registration."
      type: object
      properties:
        username:
          type: string
          description: "Username"
          example: "user123"
        password:
          type: string
          description: "Password"
          format: "password"
          example: "Str0ngPa$$w0rd!"
      required:
        - username
        - password

    TokenResponse:
      description: "The access token returned after successful login"
      type: object
      properties:
        token:
          type: string
          description: "JWT or other access token."
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        expiresIn:
          type: integer
          description: "Token expiration time (seconds)"
          example: 3600

    UserResponse:
      description: "The basic user information returned after the operation is successful."
      type: object
      properties:
        userID:
          type: string
          description: "The unique ID of the user"
          format: "uuid"
          example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        username:
          type: string
          description: "Username"
          example: "user123"

    ErrorResponse:
      description: "General error response"
      type: object
      properties:
        code:
          type: string
          description: "Internal error code"
          example: "AUTH_001"
        message:
          type: string
          description: "Detailed error message"
          example: "Invalid username or password"

    ChangePasswordRequest:
          description: "Request for password modification"
          type: object
          properties:
            username:
              type: string
              description: "Target username"
              example: "user123"
            password0:
              type: string
              description: "Current password (old password)"
              format: "password"
              example: "OldPa$$w0rd"
            password1:
              type: string
              description: "New password (new password)"
              format: "password"
              example: "NewStr0ngPa$$w0rd!"
          required:
            - username
            - password0
            - password1