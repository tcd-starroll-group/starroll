openapi: "3.0.0"
info:
  version: "1.0.0"
  title: "StarRoll API"

paths:
  # GUI
  /api/displayChatRoom:
    get:
      summary: Display chat room entry button in GUI
      description: Returns data to render chat room entry button in the graphical interface
      responses:
        "200":
          description: Button configuration retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomID:
                    type: string
                  roomName:
                    type: string
                  buttonText:
                    type: string
                  isVisible:
                    type: boolean
                  style:
                    type: object
                    description: GUI styling properties
                    properties:
                      color:
                        type: string
                      size:
                        type: string

  /api/exitChatRoom:
    post:
      summary: Exit chat room
      description: Updates user's participation status and triggers related notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - roomId
                - userId
              properties:
                roomId:
                  type: string
                  description: ID of the chat room to exit
                userId:
                  type: string
                  description: ID of the user exiting the chat room
                sendNotification:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Successfully exited chat room
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomId:
                    type: string
                  userId:
                    type: string
                  status:
                    type: string
                  notificationSent:
                    type: boolean

  /api/listUserBlogs:
    post:
      summary: "List all blogs posted by a specific user"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaginationQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogsList"

  /api/listStarBlogs:
    post:
      summary: "List all blogs under the certain star"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  properties:
                    HIP:
                      type: string
                - $ref: "#/components/schemas/PaginationQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogsList"

  /api/viewBlog:
    post:
      summary: "Details of one blog"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/blog"

  /api/createBlog:
    post:
      summary: "Create a new blog"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                HIP:
                  type: string
                title:
                  type: string
                imageURLList:
                  type: array
                  items:
                    type: string
                content:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BlogID"
                  - type: object
                    properties:
                      messages:
                        description: "Post Successful"
                        type: string

  /api/listSavedBlogs:
    post:
      summary: "List all blogs saved by the user"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaginationQuery"

      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogsList"

  # Data collection module
  /api/getLocation:
    post:
      summary: Get current location
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GPS"
  /api/getAttitude:
    post:
      summary: Get attitude of the mobile device
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/attitude"
  /api/getCameraData:
    post:
      summary: Get camera data
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  cameraMeta:
                    $ref: "#/components/schemas/cameraMeta"
                  image:
                    description: image read from camera
                    type: string
  # Astronomy Engine
  /api/getStarCatalog:
    post:
      summary: Get star catalog
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  starsNumber:
                    description: stars number
                    type: integer
                  starMetaList:
                    type: array
                    items:
                      $ref: "#/components/schemas/starMeta"
  /api/calculateStarCoordinates:
    post:
      summary: calculate star coordinates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                timeStamp:
                  description: UTC time stamp
                  type: integer
                cameraMeta:
                  $ref: "#/components/schemas/cameraMeta"
                attitude:
                  $ref: "#/components/schemas/attitude"
                starMetaList:
                  type: array
                  items:
                    $ref: "#/components/schemas/starMeta"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  starCoordinates:
                    type: array
                    items:
                      properties:
                        HIP:
                          type: integer
                        viewCoordinate:
                          $ref: "#/components/schemas/viewCoordinate"

  /api/triggerStarfieldRender:
    post:
      summary: Trigger starfield rendering
      description: Initiate starfield rendering process using corrected star coordinates and camera parameters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                cameraMeta:
                  $ref: "#/components/schemas/cameraMeta"
                correctedStarCoordinates:
                  type: array
                  items:
                    properties:
                      HIP:
                        type: integer
                      correctedViewCoordinate:
                        $ref: "#/components/schemas/viewCoordinate"
                renderParams:
                  type: object
                  properties:
                    brightness:
                      type: number
                      default: 1.0
                      description: Starfield brightness (0.0-2.0)
                    contrast:
                      type: number
                      default: 1.0
                      description: Starfield contrast (0.0-2.0)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  renderTaskId:
                    type: string
                    description: Unique ID of the rendering task
                  renderStatus:
                    type: string
                    description: Current status of rendering (pending/processing/completed)

  /api/requestStargazingTime:
    post:
      summary: Request optimal stargazing time
      description: Get recommended stargazing time range based on GPS location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                gps:
                  $ref: "#/components/schemas/GPS"
                targetDate:
                  type: string
                  format: date
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  optimalTimeRange:
                    type: object
                    properties:
                      startTime:
                        type: string
                        format: date-time
                        description: Start time of optimal stargazing
                      endTime:
                        type: string
                        format: date-time
                        description: End time of optimal stargazing
                  skyCondition:
                    type: string
                    description: Forecasted sky condition (clear/partly-cloudy/cloudy)

  /api/requestAccuracyAdjust:
    post:
      summary: Request accuracy adjustment
      description: Adjust calculation accuracy for star coordinates based on sensor precision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                accuracyLevel:
                  type: integer
                  minimum: 1
                  maximum: 5
                  default: 3
                  description: Accuracy level (1=lowest, 5=highest)
                errorTolerance:
                  type: number
                  default: 0.5
                  description: Acceptable error tolerance (pixels)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  adjustStatus:
                    type: string
                    description: Accuracy adjustment status (success/failed)
                  currentAccuracyParams:
                    type: object
                    properties:
                      accuracyLevel:
                        type: integer
                      errorTolerance:
                        type: number

  /api/displayStarfield:
    post:
      summary: Display starfield
      description: Retrieve rendered starfield data for GUI display
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                renderTaskId:
                  type: string
                  description: Unique ID of the completed rendering task
                displayMode:
                  type: string
                  enum: [preview, fullscreen, enhanced]
                  default: preview
                  description: Starfield display mode
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  starfieldData:
                    type: string
                    description: Base64-encoded starfield image data
                  resolution:
                    type: object
                    properties:
                      width:
                        type: integer
                        description: Image width (pixels)
                      height:
                        type: integer
                        description: Image height (pixels)

  /api/displayStarDetails:
    post:
      summary: Display star details
      description: Retrieve detailed astronomical information of a specific star
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                HIP:
                  type: integer
                  description: Unique HIP index of the target star
                detailLevel:
                  type: string
                  enum: [basic, detailed, complete]
                  default: basic
                  description: Level of star details to display
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/starDetails"

  /api/requestSaveType:
    post:
      summary: Request save type options
      description: Get available save types for rendered starfield
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  saveTypeList:
                    type: array
                    items:
                      type: object
                      properties:
                        typeId:
                          type: string
                          description: Unique ID of the save type
                        typeName:
                          type: string
                          description: Name of the save type (e.g., PNG, JPG, SVG)
                        fileExtension:
                          type: string
                          description: Corresponding file extension (e.g., .png, .jpg)

  /api/displaySaveSuccess:
    post:
      summary: Display save success confirmation
      description: Return save result and metadata after starfield is saved
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                saveTaskId:
                  type: string
                  description: Unique ID of the save task
                saveType:
                  type: string
                  description: Save type used (matches typeId from requestSaveType)
                fileName:
                  type: string
                  description: Name of the saved file
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  saveStatus:
                    type: string
                    description: Save status (success/failed)
                  filePath:
                    type: string
                    description: Local path or cloud URL of the saved file
                  saveTime:
                    type: string
                    format: date-time
                    description: Timestamp when the file was saved

  /api/createIdentifyStarsJob:
    post:
      summary: Create a job to identify the stars in the image.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - image
                - userID
                - token
              properties:
                image:
                  type: string
                  description: Base64-encoded image data (JPEG, PNG, etc.)
                userID:
                  type: string
                  description: User ID for authentication
                token:
                  type: string
                  description: Authentication token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  jobID:
                    description: job id
                    type: string

  /api/listIdentifyStarsJobs:
    post:
      summary: List identify stars jobs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaginationQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  total:
                    type: number
                  identifyStarsJobsList:
                    type: array
                    items:
                      $ref: "#/components/schemas/identifyStarsJob"

  /api/getIdentifyStarsJobResult:
    post:
      summary: get identify stars job result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jobID
              properties:
                jobID:
                  type: string
                  description: Unique ID of the identify stars job
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifyStarsJobResult"

  # Error Elimination Module
  /api/elimilateErrors:
    post:
      summary: Eliminating the errors between the stars' positions that we calculated and the stars' positions captured by the camera. These errors are generally caused by the limited accuracy of the sensor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                cameraMeta:
                  $ref: "#/components/schemas/cameraMeta"
                image:
                  description: image read from camera
                  type: string
                starCoordinates:
                  type: array
                  items:
                    properties:
                      HIP:
                        type: integer
                      viewCoordinate:
                        $ref: "#/components/schemas/viewCoordinate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  starCoordinates:
                    type: array
                    items:
                      properties:
                        HIP:
                          type: integer
                        correctedViewCoordinate:
                          $ref: "#/components/schemas/viewCoordinate"

  # Render Engine

  # User System

  # Social System
  /api/getChatRoom:
    post:
      summary: Join the chat room
      description: Join the chat room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - roomId
                - userStatus
                - userId
                - roomStatus
              properties:
                roomId:
                  type: string
                  description: Unique ID of the target chat room in the social system
                userId:
                  type: string
                  description: ID of the user attempting to access the chat room
                userStatus:
                  type: boolean
                  description: Check user status
                roomStatus:
                  type: boolean
                  description: Check room status
      responses:
        "200":
          description: Successfully entered the chat room
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      status:
                        type: boolean
                  - $ref: "#/components/schemas/CommonMessage"
  /api/getChatRoomInfo:
    post:
      summary: Retrieve chat room from social system
      description: Gets specified chat room information from the social system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - roomId
              properties:
                roomID:
                  type: string
      responses:
        "200":
          description: Chat room information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomID:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  creationTime:
                    type: string
                  OnlineUsers:
                    type: integer
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        userID:
                          type: string
                        username:
                          type: string
                        isOnline:
                          type: boolean

  /api/getMessage:
    post:
      summary: Retrieve chat room messages
      description: Gets historical and real-time messages from the chat room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - roomID
              properties:
                roomID:
                  type: string
                  description: ID of the chat room to retrieve messages from
                limit:
                  type: integer
                  description: Maximum number of messages to retrieve
                  default: 300
                timestamp:
                  type: string
                  description: Retrieve messages sent before this timestamp
      responses:
        "200":
          description: Messages retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomId:
                    type: string
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        messageId:
                          type: string
                        userId:
                          type: string
                        content:
                          type: string
                        timestamp:
                          type: string

  /api/sendMessage:
    post:
      summary: Send message to chat room
      description: Sends a message to the specified chat room for real-time communication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roomId:
                  type: string
                  description: ID of the target chat room
                userId:
                  type: string
                  description: ID of the user sending the message
                content:
                  type: string
                  description: Content of the message to send
      responses:
        "200":
          description: Message sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  messageId:
                    type: string
                  timestamp:
                    type: string
                  status:
                    type: string
  /api/getStarDetails:
    post:
      summary: calculate star details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                HIP:
                  type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/starDetails"
  /api/checkRoomStatus:
    post:
      summary: Check chat room status
      description: Determines if a user can join the specified chat room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - roomID
              properties:
                roomId:
                  type: string
                  description: ID of the chat room to check
      responses:
        "200":
          description: Room status retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      roomID:
                        type: string
                      isJoinable:
                        type: boolean
                      status:
                        type: string
                  - $ref: "#/components/schemas/CommonMessage"
  /api/setUser:
    post:
      summary: "Set/modify username and password"
      description: "Modify the username and password by the username, current password(password0)and new password(password1) user provided."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: "Modify password successful."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonMessage"
        "400":
          description: "Invalid request: For example, the new password does not meet the security requirements, or the new and old passwords are the same."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized: Current password (password0) is incorrect"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found: The username does not exist."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/userLogin:
    post:
      summary: "User login"
      description: "Use username and password to authentication, return a token if success."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAuth"
      responses:
        "200":
          description: "Login successful."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: "Unauthorized: Incorrect username or password."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/editProfile:
    post:
      summary: " update user profile"
      description: "update the user's profile information stored as JSON."
      security:
        - bearerAuth: [] # Assuming authentication is required, adjust if needed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/profileAndToken"
      responses:
        "200":
          description: "Profile updated successfully."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Invalid request: For example, invalid JSON format."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized: Authentication required."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "User not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/updateLastGps:
    post:
      summary: "update user last gps"
      description: "update the user's latest GPS location used by recommendation emails."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/updateLastGpsRequest"
      responses:
        "200":
          description: "Last GPS updated successfully."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonMessage"
        "401":
          description: "Unauthorized: Authentication required."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "User not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/userReg:
    post:
      summary: "User register"
      description: "Create an account with a new username and password."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: "Username"
                  example: "user123"
                password:
                  type: string
                  description: "Password"
                  format: "password"
                  example: "Str0ngPa$$w0rd!"
                email:
                  type: string
                  description: "Email address"
                  format: "email"
                  example: "user@example.com"
              required:
                - username
                - password
                - email
      responses:
        "201":
          description: "Create user successful."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Invalid request: For example, the password does not meet the requirements."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Conflict: The username is already in use."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/changePassword:
    post:
      operationId: api_change_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "200":
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonMessage"
        "401":
          description: Old password incorrect
        "404":
          description: User not found
  /api/resetPasswordSendCode:
    post:
      summary: send code to email
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordSendCodeRequest"
        required: true
      responses:
        "200":
          description: Verification code sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonMessage"
        "404":
          description: Email not found
        "500":
          description: Failed to send email

  /api/resetPassword:
    post:
      summary: Use code to reset password
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/resetPasswordRequest"
        required: true
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonMessage"
        "400":
          description: Invalid or expired verification code
        "404":
          description: Email not found

  /api/deleteUser:
    post:
      summary: 注销账号
      operationId: api_delete_user_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAuth"
        required: true
      responses:
        "200":
          description: Deletion successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonMessage"
        "401":
          description: Password incorrect
        "404":
          description: User not found
  /api/usernameVerify:
    post:
      summary: "Verify the username"
      description: "Check whether the username is available."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                username:
                  type: string
                  description: "The username to be checked"
                  example: "new_user_123"
      responses:
        "200":
          description: "Username available"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonMessage"
        "409":
          description: "The username is already in use."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/verifyUserToken:
    post:
      summary: "Verify the user's Token"
      description: "Check whether the provided Token is valid. If it is valid, return the corresponding user information."
      responses:
        "200":
          description: "Token is valid."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: "Invalid or expired Token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Social blog
  /api/deleteBlog:
    post:
      summary: "Delete a blog"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogID"

  /api/likeBlog:
    post:
      summary: "Like a blog"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BlogID"
                  - type: object
                    properties:
                      likeNumber:
                        type: integer

  /api/commentBlog:
    post:
      summary: "Comment a blog"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/BlogID"
                - type: object
                  properties:
                    commentText:
                      type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  commentID:
                    type: string

  /api/deleteComment:
    post:
      summary: "Delete a comment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/BlogID"
                - type: object
                  properties:
                    commentID:
                      type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  commentID:
                    type: string

  /api/saveBlog:
    post:
      summary: "Save a blog"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogID"

  /api/reportBlog:
    post:
      summary: "Report a blog"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/BlogID"
                - type: object
                  properties:
                    reason:
                      type: string
                      description: "Reason for reporting the blog"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogID"
  /api/getProfileStats:
    post:
      description: Retrieve the user's scanning statistics, rank, and join date for the profile view.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileStatsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileStatsResponse"
          description: OK
      summary: Get user profile stats

  /api/checkLoginStatus:
    post:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonMessage"
          description: OK
      summary: Get user profile stats

  /api/createStarMessage:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StarMessage"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonID"
          description: OK

  /api/getStarMessage:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommonID"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarMessage"
          description: OK

  /api/health:
    get:
      summary: "health check"
      responses:
        "200":
          description: OK

# Reused schemas
components:
  schemas:
    profileAndToken:
      type: object
      properties:
        username:
          type: string
          description: "Username"
          example: "user123"
        token:
          type: string
          description: "The verified access token."
        profile:
          type: object
          description: "User profile in JSON format"
          example:
            {
              "bio": "Software engineer",
              "location": "New York",
              "interests": ["coding", "reading"],
            }
      required:
        - username
        - profile
        - token

    userCredentials:
      type: object
      properties:
        userID:
          type: string
        token:
          type: string
    GPS:
      description: GPS location
      type: object
      required:
        - longitude
        - latitude
      properties:
        longitude:
          type: number
        latitude:
          type: number
    updateLastGpsRequest:
      type: object
      required:
        - gps
      properties:
        gps:
          $ref: "#/components/schemas/GPS"
    attitude:
      description: attitude of the mobile device
      type: object
      properties:
        roll:
          type: number
        pitch:
          type: number
        yaw:
          type: number
    cameraMeta:
      type: object
      properties:
        focalLength:
          description: 35mm equivalent focal length
          type: number
        length:
          description: image length, pixels
          type: integer
        hight:
          description: image hight, pixels
          type: integer
    starMeta:
      type: object
      required:
        - HIP
        - equatorialCoordinate
        - magnitude
        - pmRA
        - pmDE
        - bvColor
        - distance
      properties:
        HIP:
          description: unique HIP index
          type: integer
        equatorialCoordinate:
          $ref: "#/components/schemas/equatorialCoordinate"
        magnitude:
          description: magnitude
          type: number
        pmRA:
          description: Proper motion mu_alpha.cos(delta), The proper motion of a star along its right ascension, radian per year
          type: number
        pmDE:
          description: Proper motion mu_delta, The proper motion of a star in the direction of declination, the radian per year
          type: number
        bvColor:
          description: A measure of its surface temperature, determined by the difference between its measured blue (B) magnitude and its visual (V) magnitude.
          type: number
        distance:
          description: Distance from earth, light-year
          type: number
    equatorialCoordinate:
      type: object
      required:
        - rightAscension
        - declination
      properties:
        rightAscension:
          description: right ascension, degree
          type: number
        declination:
          description: Declination, degree
          type: number
    horizontalCoordinate:
      type: object
      required:
        - altitude
        - azimuth
      properties:
        altitude:
          type: number
        azimuth:
          type: number
    viewCoordinate:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
    starDetails:
      type: object
      properties:
        HIP:
          type: integer
        alias:
          description: alternative names
          type: array
          items:
            type: string
        diatance:
          description: Distance, light-year
          type: number
        constellation:
          description: The constellation that the star belongs to.
          type: string
        details:
          description: Detailed introduction of stars
          type: string

    # input/output model
    UserAuth:
      description: "User credentials for login or registration."
      type: object
      properties:
        username:
          type: string
          description: "Username"
          example: "user123"
        password:
          type: string
          description: "Password"
          format: "password"
          example: "Str0ngPa$$w0rd!"
      required:
        - username
        - password

    ChangePasswordRequest:
      type: object
      properties:
        username:
          type: string
        oldPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
      required:
        - username
        - oldPassword
        - newPassword

    TokenResponse:
      description: "The access token returned after successful login"
      type: object
      properties:
        token:
          type: string
          description: "JWT or other access token."
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        expiresIn:
          type: integer
          description: "Token expiration time (seconds)"
          example: 3600
        userID:
          type: string
          description: "The unique identifier for the logged-in user"
          example: "1"
      required:
        - token
        - userID

    UserResponse:
      description: "The basic user information returned after the operation is successful."
      type: object
      properties:
        userID:
          type: string
          description: "The unique ID of the user"
          example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        username:
          type: string
          description: "Username"
          example: "user123"

    CommonMessage:
      description: "Reusable response message text."
      type: object
      properties:
        message:
          type: string
          example: "Operation successful"

    CommonID:
      description: "Reusable response ID."
      type: object
      properties:
        id:
          type: string
          example: "1"

    ErrorResponse:
      description: "General error response"
      allOf:
        - type: object
          properties:
            code:
              type: string
              description: "Internal error code"
              example: "AUTH_001"
        - $ref: "#/components/schemas/CommonMessage"

    BlogID:
      description: "Reusable common ID object"
      type: object
      properties:
        blogID:
          type: string
      required:
        - blogID

    # Blog items
    BlogsList:
      description: "Reusable response for blog list endpoints"
      type: object
      properties:
        blogsList:
          type: array
          items:
            $ref: "#/components/schemas/blogPreview"

    blogPreview:
      description: "Preview of a blog on the blogs page, before user clicks into one blog"
      properties:
        blogID:
          type: string
        title:
          type: string
        imageURL:
          description: "Preview compressed image"
          type: string

    blog:
      description: "Details of one blog"
      properties:
        blogID:
          type: string
        title:
          type: string
        imageURLList:
          type: array
          items:
            type: string
        content:
          type: string
        commentList:
          type: array
          items:
            $ref: "#/components/schemas/commentItem"
        commentNumber:
          type: integer
        likeNumber:
          type: integer

    commentItem:
      properties:
        commentID:
          type: string
        commentText:
          type: string
        userID:
          type: string
        time:
          type: string

    identifyStarsJob:
      properties:
        jobID:
          type: string
        status:
          type: string
        createTime:
          type: string
        updateTime:
          type: string

    PaginationQuery:
      description: "Reusable pagination and sorting parameters for list endpoints"
      type: object
      properties:
        limit:
          type: integer
          description: "Maximum number of items to return"
          default: 20
          minimum: 1
          maximum: 100
        offset:
          type: integer
          description: "Number of items to skip (for pagination)"
          default: 0
          minimum: 0
        sort:
          type: string
          description: "Field name to sort by"
          example: "createTime"
        order:
          type: string
          enum: [asc, desc]
          default: desc
          description: "Sort order (ascending or descending)"

    IdentifyStarsJobResult:
      description: "result of identify stars job"
      properties:
        center:
          $ref: "#/components/schemas/equatorialCoordinate"
          description: "Center equatorial coordinate of the image."
        identifiedStars:
          type: array
          description: "List of identified stars in the image"
          items:
            type: object
            properties:
              names:
                type: array
                description: "Alternative names of the star"
                items:
                  type: string
                example: ["108Vir"]
              pixelX:
                type: number
                description: "X coordinate of star in image (pixels)"
                example: 1676.0093296680352
              pixelY:
                type: number
                description: "Y coordinate of star in image (pixels)"
                example: 629.9991687682354
              vmag:
                type: number
                description: "Visual magnitude of the star"
                example: 5.6
              HIP:
                type: integer
                description: "Hipparcos catalog ID"
        oriImageUrl:
          type: string

    ResetPasswordSendCodeRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: "User emial"
          example: "user@example.com"
        userName:
          type: string
          description: "User name"
          example: "name"
      required:
        - email
        - userName

    resetPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: "User email"
          example: "user@example.com"
        code:
          type: string
          description: "6 code in email"
          example: "123456"
        newPassword:
          type: string
          format: password
          description: "new password"
      required:
        - email
        - code
        - newPassword

    ProfileStatsRequest:
      type: object
      properties: {}

    ProfileStatsResponse:
      type: object
      properties:
        starsDiscovered:
          type: integer
          description: Count of stars found
        totalScans:
          type: integer
          description: Total count of all scan entries for the user
        rank:
          type: string
          description: Calculated title based on discoveries
        joinDate:
          type: string
          description: Formatted string of the user's registration date
        email:
          type: string
          description: The user's explicit email address
        profile:
          type: object
          description: "User profile data including avatar URL"
          additionalProperties: true

    StarMessage:
      type: object
      properties:
        hip:
          type: string
        from:
          type: string
        message:
          type: string
      required:
        - hip
        - from
        - message
