services:
  # MySQL: 存储用户、群聊信息及历史消息 [cite: 3, 56]
  mysql:
    image: mysql:8.0
    container_name: social_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: social_system
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Redis: 负责实时消息的 Pub/Sub (发布/订阅) [cite: 4, 57]
  redis:
    image: redis:7.0-alpine
    container_name: social_redis
    ports:
      - "6379:6379"

  # Kafka (官方镜像): 异步消息队列 [cite: 5, 58]
  kafka:
    image: apache/kafka:latest
    container_name: social_kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft 模式配置
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1

  # MinIO: 存储多媒体文件 (图片/文件) [cite: 6, 59]
  minio:
    image: minio/minio
    container_name: social_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  minio_data: