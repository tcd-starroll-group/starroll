server {
    listen       80;
    server_name  localhost;

    # 2. 前端静态页面
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # 允许上传大文件
    client_max_body_size 20M;

    # 3. 转发上传接口 -> Python (3000)
    location /upload {
        proxy_pass http://host.docker.internal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. 转发列表接口 -> Python (3000)
    location /images {
        proxy_pass http://host.docker.internal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    # match any Host that begins with "starroll-minio"
    server_name ~^starroll-minio.*;

    # proxy everything, preserving the original URI
    location / {
        proxy_pass http://starroll-minio:9000;
        proxy_set_header Host localhost:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}