openapi: 3.0.0
info:
  title: StarRoll API
  version: 1.0.0
servers:
- url: /
paths:
  /api/displayChatRoom:
    get:
      description: Returns data to render chat room entry button in the graphical
        interface
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_displayChatRoom_get_200_response"
          description: Button configuration retrieved successfully
      summary: Display chat room entry button in GUI
  /api/exitChatRoom:
    post:
      description: Updates user's participation status and triggers related notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_exitChatRoom_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_exitChatRoom_post_200_response"
          description: Successfully exited chat room
      summary: Exit chat room
  /api/listUserBlogs:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_listUserBlogs_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_listUserBlogs_post_200_response"
          description: OK
      summary: List all blogs posted by a specific user
  /api/listStarBlogs:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_listStarBlogs_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_listUserBlogs_post_200_response"
          description: OK
      summary: List all blogs under the certain star
  /api/viewBlog:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_viewBlog_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/blog"
          description: OK
      summary: Details of one blog
  /api/createBlog:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_createBlog_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_createBlog_post_200_response"
          description: OK
      summary: Create a new blog
  /api/listSavedBlogs:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_listUserBlogs_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_listUserBlogs_post_200_response"
          description: OK
      summary: List all blogs saved by the user
  /api/getLocation:
    post:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GPS"
          description: OK
      summary: Get current location
  /api/getAttitude:
    post:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/attitude"
          description: OK
      summary: Get attitude of the mobile device
  /api/getCameraData:
    post:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_getCameraData_post_200_response"
          description: OK
      summary: Get camera data
  /api/getStarCatalog:
    post:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_getStarCatalog_post_200_response"
          description: OK
      summary: Get star catalog
  /api/calculateStarCoordinates:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_calculateStarCoordinates_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_calculateStarCoordinates_post_200_response"
          description: OK
      summary: calculate star coordinates
  /api/triggerStarfieldRender:
    post:
      description: Initiate starfield rendering process using corrected star coordinates
        and camera parameters
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_triggerStarfieldRender_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_triggerStarfieldRender_post_200_response"
          description: OK
      summary: Trigger starfield rendering
  /api/requestStargazingTime:
    post:
      description: Get recommended stargazing time range based on GPS location
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_requestStargazingTime_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_requestStargazingTime_post_200_response"
          description: OK
      summary: Request optimal stargazing time
  /api/requestAccuracyAdjust:
    post:
      description: Adjust calculation accuracy for star coordinates based on sensor
        precision
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_requestAccuracyAdjust_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_requestAccuracyAdjust_post_200_response"
          description: OK
      summary: Request accuracy adjustment
  /api/displayStarfield:
    post:
      description: Retrieve rendered starfield data for GUI display
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_displayStarfield_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_displayStarfield_post_200_response"
          description: OK
      summary: Display starfield
  /api/displayStarDetails:
    post:
      description: Retrieve detailed astronomical information of a specific star
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_displayStarDetails_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/starDetails"
          description: OK
      summary: Display star details
  /api/requestSaveType:
    post:
      description: Get available save types for rendered starfield
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_requestSaveType_post_200_response"
          description: OK
      summary: Request save type options
  /api/displaySaveSuccess:
    post:
      description: Return save result and metadata after starfield is saved
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_displaySaveSuccess_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_displaySaveSuccess_post_200_response"
          description: OK
      summary: Display save success confirmation
  /api/createIdentifyStarsJob:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_createIdentifyStarsJob_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_createIdentifyStarsJob_post_200_response"
          description: OK
      summary: Create a job to identify the stars in the image.
  /api/listIdentifyStarsJobs:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_listIdentifyStarsJobs_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_listIdentifyStarsJobs_post_200_response"
          description: OK
      summary: List identify stars jobs.
  /api/getIdentifyStarsJobResult:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_getIdentifyStarsJobResult_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_getIdentifyStarsJobResult_post_200_response"
          description: OK
      summary: get identify stars job result.
  /api/elimilateErrors:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_elimilateErrors_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_elimilateErrors_post_200_response"
          description: OK
      summary: Eliminating the errors between the stars' positions that we calculated
        and the stars' positions captured by the camera. These errors are generally
        caused by the limited accuracy of the sensor.
  /api/getChatRoom:
    post:
      description: Join the chat room
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_getChatRoom_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_getChatRoom_post_200_response"
          description: Successfully entered the chat room
      summary: Join the chat room
  /api/getChatRoomInfo:
    post:
      description: Gets specified chat room information from the social system
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_getChatRoomInfo_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_getChatRoomInfo_post_200_response"
          description: Chat room information retrieved successfully
      summary: Retrieve chat room from social system
  /api/getMessage:
    post:
      description: Gets historical and real-time messages from the chat room
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_getMessage_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_getMessage_post_200_response"
          description: Messages retrieved successfully
      summary: Retrieve chat room messages
  /api/sendMessage:
    post:
      description: Sends a message to the specified chat room for real-time communication
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_sendMessage_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_sendMessage_post_200_response"
          description: Message sent successfully
      summary: Send message to chat room
  /api/getStarDetails:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_getStarDetails_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/starDetails"
          description: OK
      summary: calculate star details
  /api/checkRoomStatus:
    post:
      description: Determines if a user can join the specified chat room
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_checkRoomStatus_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_checkRoomStatus_post_200_response"
          description: Room status retrieved successfully
      summary: Check chat room status
  /api/setUser:
    post:
      description: "Modify the username and password by the username, current password(password0)and\
        \ new password(password1) user provided."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_setUser_post_200_response"
          description: Modify password successful.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Invalid request: For example, the new password does not meet\
            \ the security requirements, or the new and old passwords are the same."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Unauthorized: Current password (password0) is incorrect"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Not Found: The username does not exist."
      summary: Set/modify username and password
  /api/userLogin:
    post:
      description: "Use username and password to authentication, return a token if\
        \ success."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAuth"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Login successful.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Unauthorized: Incorrect username or password."
      summary: User login
  /api/editProfile:
    post:
      description: update the user's profile information stored as JSON.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/profileAndToken"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: Profile updated successfully.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Invalid request: For example, invalid JSON format."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Unauthorized: Authentication required."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: User not found.
      security:
      - bearerAuth: []
      summary: ' update user profile'
  /api/updateLastGps:
    post:
      description: update the user's latest GPS location used by recommendation emails.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/updateLastGpsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_updateLastGps_post_200_response"
          description: Last GPS updated successfully.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Unauthorized: Authentication required."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: User not found.
      security:
      - bearerAuth: []
      summary: update user last gps
  /api/userReg:
    post:
      description: Create an account with a new username and password.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_userReg_post_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: Create user successful.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Invalid request: For example, the password does not meet the\
            \ requirements."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Conflict: The username is already in use."
      summary: User register
  /api/changePassword:
    post:
      operationId: api_change_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_updateLastGps_post_200_response"
          description: Password updated successfully
        "401":
          description: Old password incorrect
        "404":
          description: User not found
  /api/resetPasswordSendCode:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordSendCodeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_updateLastGps_post_200_response"
          description: Verification code sent successfully
        "404":
          description: Email not found
        "500":
          description: Failed to send email
      summary: send code to email
  /api/resetPassword:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/resetPasswordRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_updateLastGps_post_200_response"
          description: Password reset successfully
        "400":
          description: Invalid or expired verification code
        "404":
          description: Email not found
      summary: Use code to reset password
  /api/deleteUser:
    post:
      operationId: api_delete_user_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAuth"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_updateLastGps_post_200_response"
          description: Deletion successful
        "401":
          description: Password incorrect
        "404":
          description: User not found
      summary: 注销账号
  /api/usernameVerify:
    post:
      description: Check whether the username is available.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_usernameVerify_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_usernameVerify_post_200_response"
          description: Username available
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The username is already in use.
      summary: Verify the username
  /api/verifyUserToken:
    post:
      description: "Check whether the provided Token is valid. If it is valid, return\
        \ the corresponding user information."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_verifyUserToken_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: Token is valid.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid or expired Token.
      summary: Verify the user's Token
  /api/deleteBlog:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_deleteBlog_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_deleteBlog_post_200_response"
          description: OK
      summary: Delete a blog
  /api/likeBlog:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_deleteBlog_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_likeBlog_post_200_response"
          description: OK
      summary: Like a blog
  /api/commentBlog:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_commentBlog_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_commentBlog_post_200_response"
          description: OK
      summary: Comment a blog
  /api/deleteComment:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_deleteComment_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_commentBlog_post_200_response"
          description: OK
      summary: Delete a comment
  /api/saveBlog:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_deleteBlog_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_deleteBlog_post_200_response"
          description: OK
      summary: Save a blog
  /api/reportBlog:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_reportBlog_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_deleteBlog_post_200_response"
          description: OK
      summary: Report a blog
  /api/health:
    get:
      responses:
        "200":
          description: OK
      summary: health check
components:
  schemas:
    profileAndToken:
      properties:
        username:
          description: Username
          example: user123
          title: username
          type: string
        token:
          description: The verified access token.
          title: token
          type: string
        profile:
          description: User profile in JSON format
          example:
            bio: Software engineer
            location: New York
            interests:
            - coding
            - reading
          title: profile
          type: object
      required:
      - profile
      - token
      - username
      title: profileAndToken
      type: object
    userCredentials:
      properties:
        userID:
          title: userID
          type: string
        token:
          title: token
          type: string
      title: userCredentials
      type: object
    GPS:
      description: GPS location
      example:
        latitude: 6.027456183070403
        longitude: 0.8008281904610115
      properties:
        longitude:
          title: longitude
          type: number
        latitude:
          title: latitude
          type: number
      required:
      - latitude
      - longitude
      title: GPS
      type: object
    updateLastGpsRequest:
      properties:
        username:
          description: Username
          title: username
          type: string
        token:
          description: The verified access token.
          title: token
          type: string
        gps:
          $ref: "#/components/schemas/GPS"
      required:
      - gps
      - token
      - username
      title: updateLastGpsRequest
      type: object
    attitude:
      description: attitude of the mobile device
      example:
        roll: 0.8008281904610115
        pitch: 6.027456183070403
        yaw: 1.4658129805029452
      properties:
        roll:
          title: roll
          type: number
        pitch:
          title: pitch
          type: number
        yaw:
          title: yaw
          type: number
      title: attitude
      type: object
    cameraMeta:
      example:
        length: 6
        hight: 1
        focalLength: 0.8008281904610115
      properties:
        focalLength:
          description: 35mm equivalent focal length
          title: focalLength
          type: number
        length:
          description: "image length, pixels"
          title: length
          type: integer
        hight:
          description: "image hight, pixels"
          title: hight
          type: integer
      title: cameraMeta
      type: object
    starMeta:
      example:
        equatorialCoordinate:
          declination: 5.962133916683182
          rightAscension: 1.4658129805029452
        distance: 3.616076749251911
        pmRA: 2.3021358869347655
        magnitude: 5.637376656633329
        pmDE: 7.061401241503109
        bvColor: 9.301444243932576
        HIP: 6
      properties:
        HIP:
          description: unique HIP index
          title: HIP
          type: integer
        equatorialCoordinate:
          $ref: "#/components/schemas/equatorialCoordinate"
        magnitude:
          description: magnitude
          title: magnitude
          type: number
        pmRA:
          description: "Proper motion mu_alpha.cos(delta), The proper motion of a\
            \ star along its right ascension, radian per year"
          title: pmRA
          type: number
        pmDE:
          description: "Proper motion mu_delta, The proper motion of a star in the\
            \ direction of declination, the radian per year"
          title: pmDE
          type: number
        bvColor:
          description: "A measure of its surface temperature, determined by the difference\
