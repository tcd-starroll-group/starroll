apiVersion: v1
kind: Secret
metadata:
  name: starroll-secret
  namespace: starroll
type: Opaque
stringData:
  .env: |
    APP_ENV=Please provide environment (e.g. dev/prod)
    MYSQL_HOST=Please provide MySQL host
    MYSQL_PORT=Please provide MySQL port
    MYSQL_USER=Please provide MySQL username
    MYSQL_PASSWORD=Please provide MySQL password
    MYSQL_DB_NAME=Please provide MySQL database name
    JWT_SECRET=Please provide JWT secret
    JWT_ALGORITHM=Please provide JWT algorithm (e.g. HS256)
    JWT_EXPIRE_HOURS=Please provide JWT expiration hours
    MINIO_ENDPOINT=Please provide MinIO endpoint (e.g. 127.0.0.1:9000)
    MINIO_ACCESS_KEY=Please provide MinIO access key
    MINIO_SECRET_KEY=Please provide MinIO secret key
    ASTRONOMY_NET_ENDPOINT=Please provide Astronomy Net service endpoint
    REDIS_HOST=Please provide Redis host
    REDIS_PORT=Please provide Redis port
    REDIS_PASSWORD=Please provide Redis password (leave empty if none)
    REDIS_DB=Please provide Redis DB number
    SMTP_HOST=Please provide SMTP host
    SMTP_PORT=Please provide SMTP port
    SMTP_USER=Please provide SMTP username
    SMTP_PASSWORD=Please provide SMTP password or application-specific password
    SMTP_FROM_EMAIL=Please provide sender email
    KAFKA_BOOTSTRAP_SERVERS=localhost:9092
