apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: starroll-backend-config
  namespace: starroll
spec:
  healthCheck:
    type: HTTP
    requestPath: /api/health
    port: 8000
    checkIntervalSec: 10
    timeoutSec: 5
  timeoutSec: 3600
  sessionAffinity:
    affinityType: GENERATED_COOKIE
    affinityCookieTtlSec: 86400
