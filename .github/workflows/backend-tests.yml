name: Backend Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -r backend/requirements.txt || echo "No requirements.txt found"

      - name: Run tests with coverage
        env:
          APP_ENV: ut
          JWT_SECRET: test_secret_key_for_github_actions_minimum_32_bytes_long
          JWT_ALGORITHM: HS256
          JWT_EXPIRE_HOURS: 2
        run: |
          pytest backend/ \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            -v

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true

      - name: Coverage comment
        if: github.event_name == 'pull_request'
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          pytest backend/ --cov=backend --cov-report=term-missing | tail -n 20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Check coverage threshold
        run: |
          coverage_percent=$(coverage report --precision=2 | grep TOTAL | awk '{print $4}' | sed 's/%//')
          echo "Coverage: ${coverage_percent}%"
          if (( $(echo "$coverage_percent < 70" | bc -l) )); then
            echo "❌ Coverage ${coverage_percent}% is below 70% threshold"
            exit 1
          else
            echo "✅ Coverage ${coverage_percent}% meets threshold"
          fi
